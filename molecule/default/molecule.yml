---
dependency:
  name: galaxy
  enabled: false

driver:
  name: docker
platforms:
  - name: ceph-mon-${MOLECULE_SCENARIO_NAME}
    groups:
      - ceph_mon
    image: "${DOCKER_REGISTRY:-quay.io/gotmax23}/${DOCKER_IMAGE_TAG:-debian-systemd:trixie}"
    command: ${DOCKER_COMMAND:-""}
    privileged: true
    pre_build_image: true
  - name: ceph-client-${MOLECULE_SCENARIO_NAME}
    groups:
      - ceph_client
      - glance_api
      - cinder_volume
      - cinder_backup
      - custom_service
    image: "${DOCKER_REGISTRY:-quay.io/gotmax23}/${DOCKER_IMAGE_TAG:-debian-systemd:trixie}"
    command: ${DOCKER_COMMAND:-""}
    privileged: true
    pre_build_image: true
  - name: ceph-compute-${MOLECULE_SCENARIO_NAME}
    groups:
      - ceph_client
      - nova_compute
    image: "${DOCKER_REGISTRY:-quay.io/gotmax23}/${DOCKER_IMAGE_TAG:-debian-systemd:trixie}"
    command: ${DOCKER_COMMAND:-""}
    privileged: true
    pre_build_image: true

provisioner:
  name: ansible
  lint:
    name: ansible-lint
  playbooks:
    prepare: ../../tests/prepare.yml
    converge: ../../tests/test.yml
    verify: ../../tests/verify.yml
    cleanup: ../../tests/cleanup.yml
  config_options:
    defaults:
      inject_facts_as_vars: false
      remote_tmp: /tmp/.ansible-${USER}/tmp
scenario:
  name: default
