- name: Prepare Ceph Monitor
  hosts: ceph_mon
  vars_files:
    - vars/test-vars.yml
    - "vars/scenario-{{ lookup('env', 'MOLECULE_SCENARIO_NAME') | default(molecule_scenario_name | default('default'), true) }}.yml"
  tasks:
    - name: Enable repositories for Ceph on EL
      when: ansible_facts['os_family'] == 'RedHat'
      block:
        - name: Install epel-release on RedHat systems
          ansible.builtin.package:
            name: epel-release
            state: present

        - name: Enable CRB repository on RedHat systems
          ansible.builtin.command: crb enable
          changed_when: false

        - name: Install CentOS storage SIG release package
          ansible.builtin.package:
            name: "centos-release-ceph-{{ ceph_stable_release | default('tentacle') }}"
            state: present

    - name: Install Ceph monitor packages
      ansible.builtin.package:
        name:
          - ceph-mon
          - ceph-base
          - ceph-common
          - "{{ (ansible_facts['os_family'] == 'Debian') | ternary('iproute2', 'iproute') }}"
        state: present
        update_cache: "{{ (ansible_facts['pkg_mgr'] == 'apt') | ternary(true, omit) }}"

    - name: Re-gather facts
      ansible.builtin.setup:
        gather_subset:
          - '!all'
          - network

    - name: Ensure /etc/ceph directory exists
      ansible.builtin.file:
        path: /etc/ceph
        state: directory
        owner: ceph
        group: ceph
        mode: "0750"

    - name: Generate minimal ceph.conf for monitor
      ansible.builtin.copy:
        dest: "/etc/ceph/{{ ceph_cluster_name }}.conf"
        owner: ceph
        group: ceph
        mode: "0644"
        content: |
          [global]
          fsid = {{ test_ceph_fsid }}
          mon initial members = {{ inventory_hostname }}
          mon host = {{ ansible_facts['default_ipv4']['address'] }}
          auth cluster required = cephx
          auth service required = cephx
          auth client required = cephx

    - name: Check if ceph monitor is initialized
      ansible.builtin.stat:
        path: "/var/lib/ceph/mon/{{ ceph_cluster_name }}-{{ inventory_hostname }}/kv_backend"
      register: mon_dir_stat

    - name: Initialize Ceph monitor
      when: not mon_dir_stat.stat.exists
      block:
        - name: Create mon keyring
          ansible.builtin.command: >-
            ceph-authtool --create-keyring /tmp/ceph.mon.keyring
            --gen-key -n mon. --cap mon 'allow *'
          changed_when: true

        - name: Create client.admin keyring
          ansible.builtin.command: >-
            ceph-authtool --create-keyring /etc/ceph/{{ ceph_cluster_name }}.client.admin.keyring
            --gen-key -n client.admin --cap mon 'allow *' --cap osd 'allow *' --cap mds 'allow *' --cap mgr 'allow *'
          changed_when: true

        - name: Import client.admin keyring into mon keyring
          ansible.builtin.command: >-
            ceph-authtool /tmp/ceph.mon.keyring
            --import-keyring /etc/ceph/{{ ceph_cluster_name }}.client.admin.keyring
          changed_when: true

        - name: Generate monmap
          ansible.builtin.command: >-
            monmaptool --create --add {{ inventory_hostname }}
            {{ ansible_facts['default_ipv4']['address'] }}
            --fsid {{ test_ceph_fsid }} /tmp/monmap
          changed_when: true

        - name: Ensure monitor directory exists
          ansible.builtin.file:
            path: "/var/lib/ceph/mon/{{ ceph_cluster_name }}-{{ inventory_hostname }}"
            state: directory
            owner: ceph
            group: ceph
            mode: "0755"

        - name: Populate monitor data directory
          ansible.builtin.command: >-
            ceph-mon --cluster {{ ceph_cluster_name }} --mkfs
            -i {{ inventory_hostname }} --monmap /tmp/monmap --keyring /tmp/ceph.mon.keyring
          changed_when: true

        - name: Set permissions on /var/lib/ceph and /etc/ceph
          ansible.builtin.file:
            path: "{{ item }}"
            owner: ceph
            group: ceph
            recurse: true
          loop:
            - /var/lib/ceph
            - /etc/ceph

        - name: Clean up temporary files
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - /tmp/ceph.mon.keyring
            - /tmp/monmap

    - name: Start and enable ceph-mon service
      ansible.builtin.systemd_service:
        name: "ceph-mon@{{ inventory_hostname }}"
        state: started
        enabled: true

    - name: Wait for Ceph monitor to be responsive
      ansible.builtin.command: ceph -s --cluster {{ ceph_cluster_name }}
      register: ceph_status
      until: ceph_status.rc == 0
      retries: 15
      delay: 2
      changed_when: false

    - name: Create Ceph client users
      ansible.builtin.command: >-
        ceph auth get-or-create client.{{ item.name }} {{ item.caps }}
        --cluster {{ ceph_cluster_name }}
      loop: "{{ test_ceph_clients }}"
      changed_when: false

- name: Prepare Ceph Client
  hosts: ceph_client
  vars_files:
    - vars/test-vars.yml
    - "vars/scenario-{{ lookup('env', 'MOLECULE_SCENARIO_NAME') | default(molecule_scenario_name | default('default'), true) }}.yml"
  tasks:
    - name: Enable repositories for Ceph on EL
      when: ansible_facts['os_family'] == 'RedHat'
      block:
        - name: Install epel-release on RedHat systems
          ansible.builtin.package:
            name: epel-release
            state: present

        - name: Enable CRB repository on RedHat systems
          ansible.builtin.command: crb enable
          changed_when: false

        - name: Install CentOS storage SIG release package
          ansible.builtin.package:
            name: "centos-release-ceph-{{ ceph_stable_release | default('tentacle') }}"
            state: present

    - name: Install python3 virtualenv prerequisites
      vars:
        _python_packages:
          debian:
            - python3
            - python3-pip
            - python3-venv
          redhat:
            - python3
            - python3-pip
      ansible.builtin.package:
        name: "{{ _python_packages[ansible_facts['os_family'] | lower] }}"
        state: present
        update_cache: "{{ (ansible_facts['pkg_mgr'] == 'apt') | ternary(true, omit) }}"

    - name: Pre-install libvirt and start service on compute nodes
      when: inventory_hostname in groups.get('nova_compute', [])
      block:
        - name: Install libvirt packages
          vars:
            _libvirt_packages:
              debian:
                - libvirt-daemon-system
                - libvirt-clients
              redhat:
                - libvirt-daemon-kvm
                - libvirt-client
          ansible.builtin.package:
            name: "{{ _libvirt_packages[ansible_facts['os_family'] | lower] }}"
            state: present

        - name: Start and enable libvirtd service
          ansible.builtin.systemd_service:
            name: "{{ libvirt_service_name | default('libvirtd') }}"
            state: started
            enabled: true

        - name: Verify virsh list succeeds
          ansible.builtin.command: virsh list --all
          changed_when: false

    - name: Ensure parent directory for virtualenv exists
      ansible.builtin.file:
        path: "{{ openstack_service_venv_bin | dirname | dirname }}"
        state: directory
        mode: "0755"

    - name: Create test python virtual environment
      ansible.builtin.command:
        cmd: "python3 -m venv {{ openstack_service_venv_bin | dirname }}"
        creates: "{{ openstack_service_venv_bin }}/python"

- name: Prepare extra ceph config and keyring files on localhost
  hosts: localhost
  gather_facts: false
  vars_files:
    - vars/test-vars.yml
    - "vars/scenario-{{ lookup('env', 'MOLECULE_SCENARIO_NAME') | default(molecule_scenario_name | default('default'), true) }}.yml"
  tasks:
    - name: Create extra ceph config file
      ansible.builtin.copy:
        dest: "{{ (ceph_extra_confs | selectattr('client_name', 'equalto', 'cinder2') | first).src }}"
        mode: "0644"
        content: |
          [global]
          fsid = {{ test_ceph_extra_fsid }}
          mon_host = 192.168.1.100

          [client.cinder2]
          keyring = /etc/ceph/ceph2.client.cinder2.keyring

    - name: Create extra ceph client keyring file
      ansible.builtin.copy:
        dest: "{{ (ceph_extra_confs | selectattr('client_name', 'equalto', 'cinder2') | first).keyring_src }}"
        mode: "0600"
        content: |
          [client.cinder2]
            key = AQBextraDummyKeyForTestingCinder2Keyring==

    - name: Check if scenario-specific prepare tasks exist
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/tasks/prepare-{{ lookup('env', 'MOLECULE_SCENARIO_NAME') | default(molecule_scenario_name | default('default'), true) }}.yml"
      register: scenario_prepare_stat

    - name: Include scenario-specific prepare tasks
      ansible.builtin.include_tasks:
        file: "tasks/prepare-{{ lookup('env', 'MOLECULE_SCENARIO_NAME') | default(molecule_scenario_name | default('default'), true) }}.yml"
      when: scenario_prepare_stat.stat.exists
