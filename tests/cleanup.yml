- name: Clean up temporary test files on localhost
  hosts: localhost
  gather_facts: false
  vars_files:
    - vars/test-vars.yml
    - "vars/scenario-{{ lookup('env', 'MOLECULE_SCENARIO_NAME') | default(molecule_scenario_name | default('default'), true) }}.yml"
  tasks:
    - name: Remove temporary ceph extra config and keyring files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: >-
        {{
          (ceph_extra_confs | default([]) | map(attribute='src') | list) +
          (ceph_extra_confs | default([]) | selectattr('keyring_src', 'defined') | map(attribute='keyring_src') | list)
        }}

    - name: Remove temporary ceph keyrings directory
      ansible.builtin.file:
        path: "{{ ceph_keyrings_dir }}"
        state: absent
      when: ceph_keyrings_dir is defined
